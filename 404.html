<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Localyze</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
  @font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url("/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2")}
  @font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url("/fonts/barlow-latin-500-normal.woff2") format("woff2")}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#05080D;color:#EAF3FB;font-family:"Barlow",system-ui,sans-serif;text-align:center}
  p.tc{font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.14em;margin:0 0 8px}
  h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(3rem,14vw,6rem);line-height:.9;margin:0 0 18px}
  a{display:inline-block;margin-top:22px;padding:14px 26px;background:#3FA4FF;color:#05080D;text-decoration:none;font-weight:500;border-radius:99px}
  p.tc{color:#9DD2F6}
</style>
</head>
<body>
  <main>
    <p class="tc">ERRO 404 · CENA NÃO ENCONTRADA</p>
    <h1>Essa cena<br>foi cortada.</h1>
    <p>A página que você procurou não existe.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
